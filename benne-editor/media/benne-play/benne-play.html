<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benne Play</title>
    <script type="module" crossorigin src="/benne-play.js"></script>
  </head>
  <body style="margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#0f0f1a;">
    <div
      id="benne-play-topbar"
      style="display:flex;align-items:center;gap:10px;flex-shrink:0;padding:6px 10px;border-bottom:1px solid #2e2e44;background:#222230;font-family:system-ui,sans-serif;"
    >
      <label for="benne-play-inventory-select" style="display:inline-flex;align-items:center;gap:8px;color:#c8d0e0;font-size:12px;user-select:none;">Inventory</label>
      <select
        id="benne-play-inventory-select"
        aria-label="Inventory item to give"
        style="min-width:180px;max-width:min(420px,50vw);padding:4px 8px;border-radius:4px;border:1px solid #5a5a70;background:#1a1a28;color:#e8ecff;font-size:12px;"
      ></select>
      <button
        type="button"
        id="benne-play-give-inventory"
        title="Add the selected item to the player inventory"
        style="flex-shrink:0;background:#3a3a52;color:#e8ecff;border:1px solid #5a5a70;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;"
      >
        Give
      </button>
    </div>
    <div id="game-container" style="flex:1;min-height:0;width:100%;position:relative;"></div>
  </body>
</html>
